# CAISSES
# Chaque texte de "rewards" doit avoir EXACTEMENT la même clé dans "reward-commands".
crates:
  basic:
    rewards:
      - "&e32x Charbon"
      - "&e16x Fer"
      - "&e8x Or"
      - "&d+50 Tokens"
    reward-commands:
      "&e32x Charbon": "give {player} coal 32"
      "&e16x Fer": "give {player} iron_ingot 16"
      "&e8x Or": "give {player} gold_ingot 8"
      "&d+50 Tokens": "craftmining tokens give {player} 50"

  rare:
    rewards:
      - "&b4x Diamant"
      - "&a2x Émeraude"
      - "&64x Netherite Scrap"
      - "&d+200 Tokens"
    reward-commands:
      "&b4x Diamant": "give {player} diamond 4"
      "&a2x Émeraude": "give {player} emerald 2"
      "&64x Netherite Scrap": "give {player} netherite_scrap 4"
      "&d+200 Tokens": "craftmining tokens give {player} 200"