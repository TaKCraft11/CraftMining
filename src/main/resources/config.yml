# CraftMining — config.yml

# Affiche les messages de débogage (anti-exploit) dans la console. À laisser sur false en production.
debug: false

database:
  auto-save-minutes: 5

xp:
  per-block: 10
  rare-block-multiplier: 3.0
  per-smelt: 5

leveling:
  xp-base: 50
  max-level: 0

tokens:
  mining:
    blocks-per-token: 10
  smelting:
    smelts-per-token: 5
  levelup:
    level-multiplier: 5
  streak:
    enabled: true
    interval-seconds: 30
    bonus-tokens: 2

progressbar:
  enabled: true
  display-ticks: 60

messages:
  level-up: "&6⬆ &eLevel UP ! &7Vous êtes maintenant niveau &a{level}&7 ! &d+{tokens} tokens ✦"
  token-earned-mining: "&7+&d{amount} token(s) ✦ &8(minage)"
  token-earned-smelt: "&7+&d{amount} token(s) ✦ &8(fonte)"
  token-earned-streak: "&7+&d{amount} token(s) ✦ &8(streak !)"

crystal-rates:
  COAL_ORE: 3
  DEEPSLATE_COAL_ORE: 5
  IRON_ORE: 5
  DEEPSLATE_IRON_ORE: 8
  COPPER_ORE: 4
  DEEPSLATE_COPPER_ORE: 6
  GOLD_ORE: 20
  DEEPSLATE_GOLD_ORE: 30
  LAPIS_ORE: 25
  DEEPSLATE_LAPIS_ORE: 38
  REDSTONE_ORE: 12
  DEEPSLATE_REDSTONE_ORE: 18
  DIAMOND_ORE: 500
  DEEPSLATE_DIAMOND_ORE: 500
  EMERALD_ORE: 750
  DEEPSLATE_EMERALD_ORE: 1000
  NETHER_QUARTZ_ORE: 10
  NETHER_GOLD_ORE: 8
  ANCIENT_DEBRIS: 2000
  MAGMA_BLOCK: 2
  AMETHYST_CLUSTER: 25

depth-bonus:
  tier1:
    bonus: 0.10
  tier2:
    bonus: 0.25
  tier3:
    bonus: 0.50
  tier4:
    bonus: 0.75

anti-exploit:
  silk-touch: true
  block-tracking: true
  block-retention-days: 7